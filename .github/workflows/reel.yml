name: Reel Instagram

on:
  schedule:
    # 14:00 UTC = 16:00 ora de iarna în România; luni și vineri
    - cron: "0 14 * * 1,5"
  workflow_dispatch:
    inputs:
      doar_test:
        description: "Doar test (creează clipul și arată descrierea, NU trimite nimic)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: postare-instagram

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalare ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Instalare dependențe Python
        run: pip install -r requirements.txt

      - name: Creare și trimitere reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOAR_TEST: ${{ inputs.doar_test }}
        run: |
          git config user.name "bot-instagram"
          git config user.email "bot-instagram@users.noreply.github.com"
          python reel.py
